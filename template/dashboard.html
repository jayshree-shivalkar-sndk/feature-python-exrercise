<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraNT Tester Dashboard</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card-box {
            background: #000;
            color: white;
            border-radius: 15px;
            padding: 20px;
            min-height: 260px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .card-box:hover {
            transform: scale(1.03);
        }

        .online {
            color: limegreen;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

        .details-link {
            color: #0dcaf0;
            text-decoration: none;
        }

        .details-link:hover {
            text-decoration: underline;
        }

        .header {
            margin-top: 20px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">

        <div class="header d-flex justify-content-between align-items-center">
            <h2>AstraNT Tester Dashboard</h2>

            <button class="btn btn-success" onclick="connectSelected()">
                Connect Selected Testers
            </button>
        </div>

        <div class="row" id="testerCards"></div>

    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Tester Information</h5>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button
